name: Build API Docker Image

on:
  workflow_run:
    workflows: [Build and Test Frontend]
    types: 
      - completed

jobs:
  on-success:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    defaults:
      run:
        working-directory: ./api

    steps:
    - uses: actions/checkout@v4
    - name: Build the Docker image
      run: docker build . --build-context project_root=../ --file Dockerfile --tag anomaly-detection-api:$(date +%s)
